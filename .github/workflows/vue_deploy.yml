# Simple workflow for deploying static content to GitHub Pages
name: Deploy Vue

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["core","develop","framework","scratch","vite","electron","vue"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v3.9.1
        with:
          node-version: 23
          cache: 'npm'
      - name: Install dependencies With -D Resolving @vitejs/plugin-vue Conflict
        run: npm i "@swc/wasm@1.3.94-nightly-20231014.1" glob -D
      - name: Build
        run: npm run build
   #   - name: Auto Enable GitHub Pages
   #     id: pages
   #     uses: actions/github-script@v7
   #     with:
   #        script: |
   #          return (await github.rest.repos.createPagesSite({
   #            owner: context.repo.owner,
   #            repo: context.repo.repo,
   #                })).html_url;
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1.0.13
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
      - name: Deploy to GitHub Pages
        id: deployment
        uses: peaceiris/actions-github-pages@v3.1.12
